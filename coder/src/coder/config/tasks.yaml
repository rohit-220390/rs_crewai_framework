coding_task:
  description: >
    Write Python code to achieve the following goal: {goal}
    
    IMPORTANT: At the end of your code, add: import time; time.sleep(15) 
    This will keep the Docker container running for 15 seconds so you can see it in Docker Desktop.
  expected_output: >
    A text file that includes the code itself, along with the output of the code when it is run. The code should be well-structured and include comments explaining the logic and functionality of each part. The output should demonstrate that the code works as expected and achieves the specified goal.
  agent: coder
  output_file: output/code_and_output.txt